<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32" role="img" aria-label="git-artifact">
  <title>git-artifact</title>
  <!--
    README icon. A copy of src/client/public/favicon.svg — the same glyph the artifact
    control on each commit row uses — with explicit width/height added, because an SVG
    with only a viewBox has no intrinsic size and GitHub renders it as a broken-image
    placeholder. Disc is --artifact-ready; glyph is --card.
  -->
  <circle cx="16" cy="16" r="16" fill="#c9761a"/>
  <g transform="translate(6 6) scale(0.8333)"
     fill="none" stroke="#fdfbf7" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="m13.11 7.664 1.78 2.672"/>
    <path d="m14.162 12.788-3.324 1.424"/>
    <path d="m20 4-6.06 1.515"/>
    <path d="M3 3v16a2 2 0 0 0 2 2h16"/>
    <path d="M10 6a2 2 0 1 0 4 0a2 2 0 1 0-4 0z"/>
    <path d="M14 12a2 2 0 1 0 4 0a2 2 0 1 0-4 0z"/>
    <path d="M7 15a2 2 0 1 0 4 0a2 2 0 1 0-4 0z"/>
  </g>
</svg>
